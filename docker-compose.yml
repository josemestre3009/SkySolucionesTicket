services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sky_ticket}
      POSTGRES_USER: ${POSTGRES_USER:-sky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sky_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sky} -d ${POSTGRES_DB:-sky_ticket}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sky}:${POSTGRES_PASSWORD:-sky_local_password}@postgres:5432/${POSTGRES_DB:-sky_ticket}?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this}
      WISPHUB_ENCRYPTION_KEY: ${WISPHUB_ENCRYPTION_KEY:-local-wisphub-encryption-key-change-this}
      PORT: 3001
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@skysoluciones.co}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
